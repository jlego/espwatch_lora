[espwatch_lora_base]
extends = esp32_base
board = espwatch_lora
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/espwatch_lora
  -D ESPWATCH_LORA
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM=1
  ; -D P_LORA_TX_LED=35   ; TX indicator LED (GPIO35, free in QSPI PSRAM mode)
  -D CORE_DEBUG_LEVEL=3
  -D PIN_USER_BTN=0
  ; LoRa module pin configuration (common for SX1262/SX1268)
  -D P_LORA_NSS=5       ; Chip Select / NSS
  -D P_LORA_DIO_1=4     ; DIO1 / IRQ
  -D P_LORA_RESET=3     ; NRST
  -D P_LORA_BUSY=6      ; BUSY
  -D P_LORA_MOSI=14     ; MOSI
  -D P_LORA_MISO=39     ; MISO
  -D P_LORA_SCLK=40     ; SCK
  ; Cardputer-Adv I2C and other pins
  -D PIN_BOARD_SDA=1
  -D PIN_BOARD_SCL=2
  -D PIN_VBAT_READ=-1   ; Battery voltage ADC
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/espwatch_lora>
  -<../variants/espwatch_lora/test_main.cpp>
  -<../variants/espwatch_lora/custom_main_old.cpp>
  -<../variants/espwatch_lora/lcd.cpp>
  -<../variants/espwatch_lora/ESPWatchTFTDisplay.cpp>
  -<../variants/espwatch_lora/custom_main.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  M5Cardputer=https://github.com/m5stack/M5Cardputer

; === ESPWatch-LoRa with SX1268 (433 MHz) ===

[espwatch_lora_sx1268_base]
extends = espwatch_lora_base
build_flags =
  ${espwatch_lora_base.build_flags}
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D SX1268_RADIO
  ; SX1268 radio configuration for 433 MHz
  -D LORA_FREQ=433  ; 433.650 MHz (SX1268: 410-810 MHz)
  -D LORA_BW=125.0      ; 250 kHz bandwidth
  -D LORA_SF=11         ; Spreading Factor 11
  -D LORA_CR=5          ; Coding Rate 4/5
  -D LORA_TX_POWER=22   ; 22 dBm TX power
  -D SX126X_DIO2_AS_RF_SWITCH=false  ; External RF switch
  -D SX126X_CURRENT_LIMIT=140        ; 140 mA current limit
  -D SX126X_RX_BOOSTED_GAIN=1        ; Enable boosted RX gain
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8    ; TCXO 1.8V

; === ESPWatch-LoRa with E22-400MM22S (SX1268, external RF switch) ===

[espwatch_lora_e22_400mm22s_base]
extends = espwatch_lora_sx1268_base
build_flags =
  ${espwatch_lora_sx1268_base.build_flags}
  ; E22-400MM22S SPI pins (SPI2)
  -D P_LORA_NSS=13      ; Chip Select / NSS
  -D P_LORA_BUSY=10     ; BUSY
  -D P_LORA_MOSI=12     ; MOSI
  -D P_LORA_MISO=11     ; MISO
  -D P_LORA_SCLK=14     ; SCK
  ; E22-400MM22S has no RESET pin, but DIO1/IRQ is connected to GPIO5
  ; -D P_LORA_DIO_1=41     ; DIO1/IRQ connected to GPIO5
  -D P_LORA_DIO_1=5     ; DIO1/IRQ connected to GPIO5
  -D P_LORA_RESET=-1    ; RESET not connected (module resets via power cycle)
  -D SX126X_DIO2_AS_RF_SWITCH=true  ; Use SX1268 DIO2 for internal RF switching
  -D SX126X_DIO3_TCXO_VOLTAGE=0.0    ; E22-400MM22S has no TCXO
  ; E22-400MM22S PA config (22dBm, PA_BOOST)
  -D SX126X_CURRENT_LIMIT=140
  ; 490 MHz matches the antenna
  -D LORA_FREQ=433.0    ; 490.0 MHz (SX1268: 410-810 MHz)
  -D LORA_TX_POWER=22   ; 20 dBm TX power (100 mW)
  ; 240x285 TFT display pins (FSPI - separate SPI controller)
  -D LCD_CS=18          ; LCD Chip Select
  -D LCD_RST=-1         ; LCD Reset (not used / power-on reset)
  -D LCD_LED=15         ; LCD Backlight / Enable
  -D VSPI_SCLK=16       ; LCD SPI Clock (FSPI CLK)
  -D VSPI_MOSI=17       ; LCD SPI MOSI (FSPI MOSI)
  -D VSPI_MISO=-1       ; LCD SPI MISO not used (FSPI MISO)
  -D VSPI_SS=18         ; LCD SPI SS (same as LCD_CS)
  ; Peripheral pins
  -D PIN_USER_BTN=0     ; G0 button (short press = advert)
  -D PIN_BTN_2=45       ; Power button - SHORT press only (cycle page); long press = hardware power-off, NOT used by UI
  -D CUSTOM_BUZZER_PIN=3 ; Passive buzzer (custom macro to avoid pulling NonBlockingRtttl library)
  -D PIN_I2C_SDA=1      ; I2C SDA (was 2, swapped)
  -D PIN_I2C_SCL=2      ; I2C SCL (was 1, swapped)
  ; I2C peripheral addresses
  -D CW2015_I2C_ADDR=0x62
  -D BM8563_I2C_ADDR=0x51

; === ESPWatch-LoRa with E220-400MM22S (LLCC68, DIO2 RF switch) ===

[espwatch_lora_e220_400mm22s_base]
extends = espwatch_lora_base
build_flags =
  ${espwatch_lora_base.build_flags}
  -D RADIO_CLASS=CustomLLCC68
  -D WRAPPER_CLASS=CustomLLCC68Wrapper
  -D LLCC68_RADIO
  ; E220-400MM22S SPI pins (SPI2) - same pinout as E22-400MM22S
  -D P_LORA_NSS=13      ; Chip Select / NSS
  -D P_LORA_BUSY=10     ; BUSY
  -D P_LORA_MOSI=12     ; MOSI
  -D P_LORA_MISO=11     ; MISO
  -D P_LORA_SCLK=14     ; SCK
  -D P_LORA_DIO_1=5     ; DIO1/IRQ connected to GPIO5
  -D P_LORA_RESET=-1    ; RESET not connected (module resets via power cycle)
  ; LLCC68 radio configuration for 433 MHz
  -D LORA_FREQ=433.0    ; 433.0 MHz (LLCC68: 410-493 MHz)
  -D LORA_BW=125.0      ; 125 kHz bandwidth
  -D LORA_SF=11         ; Spreading Factor 11 (LLCC68 max SF11, no SF12)
  -D LORA_CR=5          ; Coding Rate 4/5
  -D LORA_TX_POWER=22   ; 22 dBm TX power
  -D SX126X_DIO2_AS_RF_SWITCH=true  ; Use DIO2 for internal RF switching
  -D SX126X_DIO3_TCXO_VOLTAGE=0.0    ; E220-400MM22S has no TCXO (uses crystal)
  -D SX126X_CURRENT_LIMIT=140        ; 140 mA current limit
  ; 240x285 TFT display pins (FSPI - separate SPI controller)
  -D LCD_CS=18          ; LCD Chip Select
  -D LCD_RST=-1         ; LCD Reset (not used / power-on reset)
  -D LCD_LED=15         ; LCD Backlight / Enable
  -D VSPI_SCLK=16       ; LCD SPI Clock (FSPI CLK)
  -D VSPI_MOSI=17       ; LCD SPI MOSI (FSPI MOSI)
  -D VSPI_MISO=-1       ; LCD SPI MISO not used (FSPI MISO)
  -D VSPI_SS=18         ; LCD SPI SS (same as LCD_CS)
  ; Peripheral pins
  -D PIN_USER_BTN=0     ; G0 button (short press = advert)
  -D PIN_BTN_2=45       ; Power button - SHORT press only (cycle page); long press = hardware power-off, NOT used by UI
  -D CUSTOM_BUZZER_PIN=3 ; Passive buzzer
  -D PIN_I2C_SDA=1      ; I2C SDA
  -D PIN_I2C_SCL=2      ; I2C SCL
  ; I2C peripheral addresses
  -D CW2015_I2C_ADDR=0x62
  -D BM8563_I2C_ADDR=0x51

; === ESPWatch-LoRa with E22-400MM22S companion ===

[env:ESPWatch-LoRa_e22_400mm22s_companion]
extends = espwatch_lora_e22_400mm22s_base
build_flags =
  ${espwatch_lora_e22_400mm22s_base.build_flags}
  -D CUSTOM_BOARD
  -D DISPLAY_CLASS=ESPWatchTFTDisplay
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=30
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  -D MESH_DEBUG=1
  ; 开启中继模式 (Enable repeater mode)
  -D ENABLE_REPEATER_MODE=1
  -D CONFIG_BT_BTC_TASK_STACK_SIZE=4096
  -D CONFIG_BLUEDROID_PINNED_TO_CORE_0=0
  -D CONFIG_BLUEDROID_PINNED_TO_CORE_1=1
  -D CONFIG_ESP32_WIFI_TASK_PINNED_TO_CORE_0=1
  -D CONFIG_BT_GATT_MAX_SR_ATTRIBUTES=30
  -I examples/companion_radio
  -D LV_CONF_INCLUDE_SIMPLE
build_src_filter = ${espwatch_lora_e22_400mm22s_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/MyMesh.cpp>
  +<../examples/companion_radio/DataStore.cpp>
  +<../variants/espwatch_lora/custom_main.cpp>
  +<../variants/espwatch_lora/lcd.cpp>
  +<../variants/espwatch_lora/ESPWatchTFTDisplay.cpp>
lib_deps =
  ${espwatch_lora_e22_400mm22s_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  lvgl/lvgl @ ^8.3.11

